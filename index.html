<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameList</title>
</head>

<body>

    <header>
        <h1>GameList</h1>
        <p>Organize os jogos que você joga ou pretende jogar.</p>

        <nav>
            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#jogos">Jogos</a></li>
                <li><a href="#cadastro">Cadastrar jogo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inicio">
            <h2>Minha biblioteca de jogos</h2>
            <p>
                Acompanhe seus jogos, organize o que está jogando
                e registre os títulos que pretende jogar.
            </p>
        </section>
        <section id="cadastro">
            <h2>Cadastrar jogo</h2>

            <form>
                <div>
                    <label for="nome">Nome do jogo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="genero">Gênero:</label>
                    <select id="genero" name="genero">
                        <option value="">Selecione</option>
                        <option value="acao">Ação</option>
                        <option value="aventura">Aventura</option>
                        <option value="rpg">RPG</option>
                        <option value="terror">Terror</option>
                        <option value="estrategia">Estratégia</option>
                    </select>
                </div>

                <div>
                    <label for="plataforma">Plataforma:</label>
                    <select id="plataforma" name="plataforma">
                        <option value="">Selecione</option>
                        <option value="pc">PC</option>
                        <option value="playstation">PlayStation</option>
                        <option value="xbox">Xbox</option>
                        <option value="switch">Nintendo Switch</option>
                    </select>
                </div>

                <div>
                    <label for="ano">Ano de lançamento:</label>
                    <input type="number" id="ano" name="ano">
                </div>

                <div>
                    <label for="status">Status:</label>
                    <select id="status" name="status">
                        <option value="jogando">Jogando</option>
                        <option value="quero-jogar">Quero jogar</option>
                        <option value="finalizado">Finalizado</option>
                    </select>
                </div>

                <div>
                    <label for="avaliacao">Avaliação:</label>
                    <input type="number" id="avaliacao" name="avaliacao" min="0" max="10">
                </div>

                <button type="submit">Cadastrar</button>
            </form>
        </section>
        <section id="pesquisa">
            <h2>Pesquisar jogos</h2>

            <div>
                <label for="buscar">Nome do jogo:</label>
                <input type="search" id="buscar" name="buscar" placeholder="Digite o nome do jogo">
                <button type="button">Pesquisar</button>
            </div>

            <div>
                <label for="filtro-status">Filtrar por status:</label>
                <select id="filtro-status" name="filtro-status">
                    <option value="todos">Todos</option>
                    <option value="jogando">Jogando</option>
                    <option value="quero-jogar">Quero jogar</option>
                    <option value="finalizado">Finalizado</option>
                </select>
            </div>

            <div>
                <label for="ordenacao">Ordenar por:</label>
                <select id="ordenacao" name="ordenacao">
                    <option value="nome">Nome</option>
                    <option value="ano">Ano de lançamento</option>
                    <option value="avaliacao">Avaliação</option>
                </select>
            </div>
        </section>
    </main>

    <footer>
        <p>GameList - 2026</p>
    </footer>

</body>

</html>
